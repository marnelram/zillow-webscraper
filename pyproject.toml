[project]
name = "aptagent"
version = "0.1.0"
description = "Personal apartment-hunting agent for Seattle: fetch listings, score against preferences, enrich the shortlist with an LLM, and push a weekly digest to Telegram."
authors = [{ name = "Marnel Ramirez", email = "marnelram@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "typer>=0.12",
    "tenacity>=8.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
aptagent = "aptagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aptagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
