# Apartment-hunt preferences for the scoring engine. Tune freely — re-run `aptagent score`.
# Derived from the user's stated criteria (see agent-memory/apartment-hunt-preferences.md).

hard_filters:
  total_cost_cap: 3000        # reject if rent + parking + pet rent exceeds this
  require_rent: true          # drop listings with no rent (can't rank)

soft:
  rent_floor: 1200            # rent at/below this = best affordability score
  min_sqft: 450               # "enough space" — soft penalty below this, not a reject
  bedroom_pref: [0, 1]        # 0 == studio; studio/1BR preferred

move_in:
  earliest: 2026-11-01
  latest: 2027-02-28
  # Soft, not a hard filter: listings turn over, so today's inventory rarely shows
  # Nov+ availability. In-window availability gets a bonus; far-off gets a mild penalty.
  mode: soft

neighborhoods:
  # Names must exist in aptagent.enrich.geo.NEIGHBORHOODS.
  preferred: [Northgate, Green Lake, Roosevelt, Maple Leaf, Wallingford, Shoreline, Mountlake Terrace, Lynnwood, Bellevue]
  avoid: [Capitol Hill]            # crime concern — strong downrank, not excluded
  preferred_radius_mi: 2.5
  avoid_radius_mi: 1.0
  avoid_penalty: 0.55              # score x0.55 when inside an avoided area

# Relative importance. Need not sum to 100 — the engine normalizes over whichever
# factors have data for a given listing. Set a weight to 0 to disable a factor.
weights:                      # profile: location-first, neighborhood-aware
  transit_access: 32          # quick transit = top priority
  neighborhood_pref: 28       # near preferred areas (north Seattle / Lynnwood / Bellevue)
  light_rail: 25              # near a Link station
  grocery: 18                 # near a supermarket (you cook) — OSM proximity
  affordability: 18           # cheaper is better (still capped at $3k total)
  gym: 15                     # best-effort (sparse in structured data; enrichment helps)
  parks: 10
  bedroom_pref: 10
  move_in: 8
  neighborhood_feel: 5        # Census income/renter proxy (needs CENSUS_API_KEY)
  high_floor: 5               # best-effort (floor rarely in data; enrichment fills)
  south_facing: 5             # best-effort (for the in-house garden; enrichment fills)
  # central_seattle removed — replaced by neighborhood_pref (north/Eastside lean)
